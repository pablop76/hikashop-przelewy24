; Narzucona metoda płatności
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID="Narzucona metoda płatności"
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID_HELP="Zostaw puste albo zero, żeby klient wybierał sposób zapłaty na stronie Przelewów24. Wpisanie numeru metody kieruje go od razu do niej, z pominięciem wyboru. Numer 303 oznacza raty. Chcąc mieć w sklepie osobno zwykłą płatność i raty, utwórz drugą metodę płatności tego samego typu i wpisz w niej 303. Ograniczenia kwotowe rat ustaw polami najniższej i najwyższej wartości zamówienia poniżej."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ALREADY_PAID="To zamówienie zostało już opłacone. Jeżeli uważasz, że to pomyłka, skontaktuj się ze sklepem."
