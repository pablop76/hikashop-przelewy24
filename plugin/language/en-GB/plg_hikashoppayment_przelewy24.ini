PLG_HIKASHOPPAYMENT_PRZELEWY24_DEFAULT_NAME="Przelewy24"
PLG_HIKASHOPPAYMENT_PRZELEWY24_DEFAULT_DESCRIPTION="Pay with Przelewy24: BLIK, card, bank transfer, Apple Pay and Google Pay."

; Plugin configuration
PLG_HIKASHOPPAYMENT_PRZELEWY24_TEST_MODE="Test environment"
PLG_HIKASHOPPAYMENT_PRZELEWY24_TEST_MODE_HELP="When enabled, payments go to sandbox.przelewy24.pl. The sandbox account is separate from the production one and has its own merchant id and its own keys. Turn this off only once you have entered production credentials."
PLG_HIKASHOPPAYMENT_PRZELEWY24_MERCHANT_ID="Merchant ID"
PLG_HIKASHOPPAYMENT_PRZELEWY24_MERCHANT_ID_HELP="The account number shown in the Przelewy24 panel as Account data. It also serves as the username for API authentication."
PLG_HIKASHOPPAYMENT_PRZELEWY24_POS_ID="Shop ID"
PLG_HIKASHOPPAYMENT_PRZELEWY24_POS_ID_HELP="Fill this in only if Przelewy24 assigned your shop a number different from the merchant id. Leaving it empty means both numbers are the same."
PLG_HIKASHOPPAYMENT_PRZELEWY24_CRC_KEY="CRC key"
PLG_HIKASHOPPAYMENT_PRZELEWY24_CRC_KEY_HELP="Przelewy24 panel, My data, the CRC key field. Used to sign transactions and to verify notifications."
PLG_HIKASHOPPAYMENT_PRZELEWY24_API_KEY="API key"
PLG_HIKASHOPPAYMENT_PRZELEWY24_API_KEY_HELP="Przelewy24 panel, My data, the Reports key field. This is the key used as the API password. Do not confuse it with the Orders key, which belongs to the older form based interface and will not work here."
PLG_HIKASHOPPAYMENT_PRZELEWY24_NOTIFY_URL="Notification address"
PLG_HIKASHOPPAYMENT_PRZELEWY24_NOTIFY_URL_HELP="There is nothing to enter here. The plugin sends this address to Przelewy24 with every transaction. It has to be reachable from the internet, so notifications will not arrive on a local machine."
PLG_HIKASHOPPAYMENT_PRZELEWY24_DEBUG="Diagnostic log"
PLG_HIKASHOPPAYMENT_PRZELEWY24_DEBUG_HELP="Records the payment flow in the HikaShop log. Keys and checksums are stripped from it. Keep this off in production and switch it on only while investigating a problem."

PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFIED_STATUS="Status after confirmed payment"
PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFIED_STATUS_HELP="This status is applied only after Przelewy24 confirms the transaction. The customer returning to the shop is never enough on its own."
PLG_HIKASHOPPAYMENT_PRZELEWY24_INVALID_STATUS="Status after failed payment"
PLG_HIKASHOPPAYMENT_PRZELEWY24_INVALID_STATUS_HELP="Applied only when Przelewy24 explicitly answers that the transaction is not paid. A connection error, an outdated key or an outage on the Przelewy24 side does not change the order status. In that case you receive a message at the payment notification address set in the HikaShop configuration."
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUNDS="Refunds"
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUNDS_HELP="Refunds are made in the Przelewy24 panel, in the transaction details. The plugin never returns money on its own: an order status changes too easily, also in bulk, and a refund cannot be undone."

; Panel warnings
PLG_HIKASHOPPAYMENT_PRZELEWY24_KEYS_REQUIRED="Enter the merchant id, the CRC key and the API key. Without all three the payment method will not work."
PLG_HIKASHOPPAYMENT_PRZELEWY24_PRODUCTION_WARNING="This payment method runs against the Przelewy24 production environment. Transactions will be real."
PLG_HIKASHOPPAYMENT_PRZELEWY24_IP_REMINDER="Remember to register your server IP address in the Przelewy24 panel, under API data and configuration. Without that entry every API call fails with an authentication error that looks exactly like a wrong key."

; Transaction description shown in the Przelewy24 panel
PLG_HIKASHOPPAYMENT_PRZELEWY24_ORDER_DESCRIPTION="Order no. %s"

; Gateway hand off page
PLG_HIKASHOPPAYMENT_PRZELEWY24_GOING_TO_GATEWAY="Taking you to payment"
PLG_HIKASHOPPAYMENT_PRZELEWY24_GOING_TO_GATEWAY_INFO="You are about to be taken to Przelewy24, where you will choose how to pay."
PLG_HIKASHOPPAYMENT_PRZELEWY24_GO_TO_GATEWAY="Go to payment"
PLG_HIKASHOPPAYMENT_PRZELEWY24_MANUAL_HINT="If the page does not open by itself, use the button above."

; Payment could not start
PLG_HIKASHOPPAYMENT_PRZELEWY24_PAYMENT_NOT_STARTED="Payment could not be started"
PLG_HIKASHOPPAYMENT_PRZELEWY24_BACK_TO_CHECKOUT="Try to pay again"
PLG_HIKASHOPPAYMENT_PRZELEWY24_RETRY_INVALID="This payment link is not valid. Open the order from your customer account or contact the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_RETRY_UNAVAILABLE="This order can no longer be paid. Please contact the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ORDER_KEPT="Your order has been saved and is waiting for payment. Nothing has been lost."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ERROR_CONFIG="Online payment is temporarily unavailable. Please contact the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ERROR_AUTH="Online payment is temporarily unavailable. Please contact the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ERROR_REGISTER="We could not reach Przelewy24. Please try again in a moment."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ERROR_EMAIL_TOO_LONG="Your e-mail address is longer than 50 characters and Przelewy24 does not accept such addresses. Choose another payment method or contact the shop."

; Message to the merchant when a payment could not be confirmed
PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFY_ALERT_SUBJECT="Przelewy24: payment for order no. %s could not be confirmed"
PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFY_ALERT_INTRO="Przelewy24 notified the shop about a payment for order no. %1$s, but the shop could not confirm it. Przelewy24 answered: %2$s"
PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFY_ALERT_STATE="The order status has not been changed. Przelewy24 repeats the notification for several hours, so once the cause is removed the payment confirms itself. If it does not, the money stays in Przelewy24 at the customer's disposal and does not reach the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_VERIFY_ALERT_CAUSES="Most common causes: the server IP address is not listed in the Przelewy24 panel or the API key has changed. Check the transaction in the Przelewy24 panel (session identifier: %s) and the HikaShop payment log. This is the only message about this order."

; BLIK in shop
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_IN_SHOP="BLIK code at checkout"
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_IN_SHOP_HELP="Adds a field for the six digit BLIK code at checkout. The customer then confirms the payment in their banking app without leaving the shop. If the customer leaves the field empty, they are taken to the Przelewy24 payment page as usual.<br><strong>Requires the BLIK Level 0 service on your Przelewy24 account.</strong> It is not the same as BLIK on the payment page and is not enabled by default. Without it every attempt fails with error 401 and the customer is sent to the Przelewy24 payment page. The service is enabled by your account manager or by technical support through the <a href='https://www.przelewy24.pl/centrum-pomocy/wsparcie-techniczne-api/brakuje-odpowiedzi-na-twoje-pytanie' target='_blank' rel='noopener'>contact form</a> (Przelewy24 does not publish a support e-mail). Ask for the paymentMethod/blik/chargeByCode method, separately for sandbox and production."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_LEVEL0_REMINDER="BLIK code at checkout is enabled. It only works if Przelewy24 has enabled the BLIK Level 0 service (paymentMethod/blik/chargeByCode) on your account. It is not enabled by default. If the payment log shows error 401 for BLIK, request it through the form: %s"
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_CODE="BLIK code"
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_HINT="Enter the code from your banking app, or leave this empty to choose how to pay on the Przelewy24 page."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_CODE_INVALID="A BLIK code has six digits. Please check what you entered."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_WAITING="Confirm the payment in your banking app"
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_WAITING_INFO="We have sent a payment request to your bank. Open the app and confirm it. You usually have about two minutes."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_WAITING_AFTER="Once confirmed, the order will be paid automatically. You can close this page."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_OR_PAYWALL="Would you rather pay another way?"

; BLIK rejections
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_WRONG_CODE="That BLIK code is not valid. Generate a new one in your banking app."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_CODE_EXPIRED="The BLIK code has expired. Generate a new one and try again."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_CODE_USED="That BLIK code has already been used. Generate a new one."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_CODE_STATUS="The BLIK code was not accepted. Generate a new one and try again."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_INSUFFICIENT_FUNDS="There are not enough funds in the account for this payment."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_LIMIT_EXCEEDED="The payment exceeds the limit set by your bank."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_ISSUER_DECLINED="Your bank declined this payment. Please choose another way to pay."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_BAD_PIN="Your bank rejected the confirmation. Please try again in the app."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_USER_TIMEOUT="Time to confirm ran out. Generate a new code and try again."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_TIMEOUT="Your bank did not respond in time. Generate a new code and try again."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_ALIAS_DECLINED="The saved device was declined by your bank."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_ALIAS_NOT_FOUND="No saved BLIK device was found."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_SYSTEM_ERROR="BLIK payment is temporarily unavailable. Please choose another way to pay."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_ERROR_GENERAL_ERROR="The BLIK payment could not be completed. Please choose another way to pay."

; Forced payment method
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID="Forced payment method"
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID_HELP="Leave this empty or zero to let the customer choose how to pay on the Przelewy24 page. Entering a method number takes them straight to it, skipping the choice. Number 303 means instalments. To offer both a regular payment and instalments, create a second payment method of the same type and enter 303 in it. Set the instalment amount limits using the minimum and maximum order value fields below."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ALREADY_PAID="This order has already been paid. If you believe this is a mistake, please contact the shop."

; The order has already been paid (page shown instead of the gateway hand off)
PLG_HIKASHOPPAYMENT_PRZELEWY24_PAID_TITLE="This order has already been paid"
PLG_HIKASHOPPAYMENT_PRZELEWY24_PAID_CONFIRMED="Przelewy24 has confirmed your payment and the order is paid. There is nothing more you need to do."
PLG_HIKASHOPPAYMENT_PRZELEWY24_PAID_PENDING="Przelewy24 has recorded your payment. The confirmation will appear in the shop shortly. Please do not pay again."
PLG_HIKASHOPPAYMENT_PRZELEWY24_PAID_MISMATCH="A payment for this order has already been received, but for a different amount than the current order value. Please contact the shop before paying again."

; Return from the payment page without a confirmed payment (page shown instead of the thank you page)
PLG_HIKASHOPPAYMENT_PRZELEWY24_RETURN_UNPAID_TITLE="The payment has not been confirmed"
PLG_HIKASHOPPAYMENT_PRZELEWY24_RETURN_UNPAID="Przelewy24 has not confirmed a payment for this order. If the payment was interrupted or declined, pay again using the button below. If the money has already been sent, for example by a regular bank transfer, do nothing: you will get a confirmation by e-mail once the payment arrives."
PLG_HIKASHOPPAYMENT_PRZELEWY24_RETURN_UNKNOWN="We could not check with Przelewy24 right now whether your payment went through. If the money has already been sent, do nothing: you will get a confirmation by e-mail. If the payment failed, please try to pay again in a moment."
