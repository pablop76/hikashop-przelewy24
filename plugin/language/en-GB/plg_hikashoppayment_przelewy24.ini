PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_IN_SHOP_HELP="Adds a field for the six digit BLIK code at checkout. The customer then confirms the payment in their banking app without leaving the shop. This requires separate approval from Przelewy24. If the customer leaves the field empty, they are taken to the Przelewy24 payment page as usual."
PLG_HIKASHOPPAYMENT_PRZELEWY24_BLIK_CODE="BLIK code"
