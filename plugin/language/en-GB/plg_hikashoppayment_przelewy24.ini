; Forced payment method
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID="Forced payment method"
PLG_HIKASHOPPAYMENT_PRZELEWY24_METHOD_ID_HELP="Leave this empty or zero to let the customer choose how to pay on the Przelewy24 page. Entering a method number takes them straight to it, skipping the choice. Number 303 means instalments. To offer both a regular payment and instalments, create a second payment method of the same type and enter 303 in it. Set the instalment amount limits using the minimum and maximum order value fields below."
PLG_HIKASHOPPAYMENT_PRZELEWY24_ALREADY_PAID="This order has already been paid. If you believe this is a mistake, please contact the shop."

; Refund trigger
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_STATUS="Status that triggers a refund"
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_STATUS_NONE="— no automatic refunds —"
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_STATUS_WARNING="WARNING: setting an order to this status WILL RETURN THE MONEY TO THE CUSTOMER. This is a real refund transfer, not a label change in the admin."
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_STATUS_HELP="Leave “no automatic refunds” selected so that refunds never happen on their own. Once a status is selected, every change of an order to that status submits a refund of the full paid amount to Przelewy24. A refund is submitted only once per order and only for a payment that was confirmed earlier. It cannot be undone from the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_TRIGGER_ACTIVE="Automatic refunds are ENABLED. Setting an order to the status %s will return the money to the customer."
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_SENT_NOTICE="A refund of %1$s %2$s was submitted for order no. %3$s. The money will be returned to the customer. This cannot be undone from the shop."
PLG_HIKASHOPPAYMENT_PRZELEWY24_REFUND_FAILED_NOTICE="The refund for order no. %s could not be submitted. The money has NOT been returned. See the payment log for details."
